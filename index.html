<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>श्री छत्रपती गणेश मित्र मंडळ - घोडसगाव</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f4f4;
  padding:12px;
}

.container{
  max-width:1100px;
  margin:auto;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#ff6b00,#e91e63);
  color:white;
  text-align:center;
  padding:25px 10px;
  border-radius:18px;
  margin-bottom:15px;
  box-shadow:0 4px 12px #ccc;
}

.header h1{
  font-size:27px;
  margin-bottom:8px;
}

.header p{
  font-size:15px;
}

/* SUMMARY */
.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}

.card{
  background:white;
  padding:18px 8px;
  text-align:center;
  border-radius:12px;
  box-shadow:0 2px 8px #ddd;
}

.card h2{
  color:#e65100;
  margin-bottom:5px;
}

/* FORM */
.form{
  background:white;
  padding:18px;
  border-radius:15px;
  box-shadow:0 2px 8px #ddd;
  margin-bottom:15px;
}

.form h2{
  margin-bottom:15px;
  color:#333;
}

input,select{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  color:white;
  background:#ff6600;
  font-size:14px;
  cursor:pointer;
  margin:3px;
}

button:hover{
  opacity:.85;
}

.search{
  margin-bottom:15px;
}

/* TABLE */
.table-box{
  background:white;
  padding:12px;
  border-radius:15px;
  overflow-x:auto;
  box-shadow:0 2px 8px #ddd;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}

th,td{
  padding:11px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

th{
  background:#ff6600;
  color:white;
}

.paid{
  color:green;
  font-weight:bold;
}

.pending{
  color:red;
  font-weight:bold;
}

.delete{
  background:#e53935;
}

.receipt{
  background:#1976d2;
}

.download{
  background:#388e3c;
}

/* MOBILE */
@media(max-width:600px){

  .summary{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:22px;
  }

  .header{
    padding:20px 8px;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
  <h1>🕉 श्री छत्रपती गणेश मित्र मंडळ 🕉️</h1>
  <p>घोडसगाव</p>
  <p>श्री गणेश उत्सव वर्गणी व्यवस्थापन</p>
</div>


<!-- SUMMARY -->
<div class="summary">

  <div class="card">
    <h2 id="people">0</h2>
    <p>एकूण लोक</p>
  </div>

  <div class="card">
    <h2>₹ <span id="total">0</span></h2>
    <p>एकूण जमा वर्गणी</p>
  </div>

  <div class="card">
    <h2 id="paid">0</h2>
    <p>वर्गणी दिलेले</p>
  </div>

</div>


<!-- FORM -->
<div class="form">

<h2>➕ नवीन वर्गणी जमा करा</h2>

<input id="name" type="text" placeholder="👤 माणसाचे पूर्ण नाव">

<input id="mobile" type="tel" placeholder="📱 मोबाईल नंबर">

<input id="amount" type="number" placeholder="💰 वर्गणी रक्कम">

<input id="date" type="date">

<select id="status">

<option value="Paid">✅ वर्गणी दिली</option>

<option value="Pending">⏳ वर्गणी बाकी</option>

</select>

<button onclick="addData()">➕ Data जमा करा</button>

</div>


<!-- SEARCH -->

<input
class="search"
id="search"
type="text"
placeholder="🔍 नाव किंवा मोबाईल नंबर शोधा..."
onkeyup="searchData()"
>


<!-- DOWNLOAD -->

<div style="margin-bottom:10px;">

<button class="download" onclick="downloadCSV()">
📥 Excel/CSV Download
</button>

</div>


<!-- TABLE -->

<div class="table-box">

<table>

<thead>

<tr>

<th>क्र.</th>
<th>नाव</th>
<th>मोबाईल</th>
<th>रक्कम</th>
<th>तारीख</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>


<script>

let data =
JSON.parse(localStorage.getItem("jayBholeData")) || [];


/* DISPLAY DATA */

function displayData(list=data){

let table=document.getElementById("table");

table.innerHTML="";

list.forEach((person,index)=>{

let row=`

<tr>

<td>${index+1}</td>

<td>${person.name}</td>

<td>${person.mobile}</td>

<td>₹${person.amount}</td>

<td>${person.date}</td>

<td class="${person.status==='Paid'?'paid':'pending'}">

${person.status==='Paid'
?'✅ Paid'
:'⏳ Pending'}

</td>

<td>

<button
class="receipt"
onclick="printReceipt(${index})">
🧾 Receipt
</button>

<button
class="delete"
onclick="deleteData(${index})">
🗑️ Delete
</button>

</td>

</tr>

`;

table.innerHTML+=row;

});

updateSummary();

}


/* ADD DATA */

function addData(){

let name=document.getElementById("name").value.trim();

let mobile=document.getElementById("mobile").value.trim();

let amount=document.getElementById("amount").value;

let date=document.getElementById("date").value;

let status=document.getElementById("status").value;


if(name==="" || mobile==="" || amount===""){

alert("कृपया नाव, मोबाईल नंबर आणि रक्कम भरा!");

return;

}


let person={

name:name,

mobile:mobile,

amount:Number(amount),

date:date,

status:status

};


data.push(person);


localStorage.setItem(
"jayBholeData",
JSON.stringify(data)
);


document.getElementById("name").value="";

document.getElementById("mobile").value="";

document.getElementById("amount").value="";

document.getElementById("date").value="";


displayData();


alert("✅ वर्गणीचा Data जमा झाला!");

}


/* DELETE */

function deleteData(index){

if(confirm("हा Data delete करायचा आहे का?")){

data.splice(index,1);

localStorage.setItem(
"jayBholeData",
JSON.stringify(data)
);

displayData();

}

}


/* SUMMARY */

function updateSummary(){

document.getElementById("people").innerText=data.length;


let total=data.reduce(
(sum,p)=>sum+Number(p.amount),0
);

document.getElementById("total").innerText=total;


let paid=data.filter(
p=>p.status==="Paid"
).length;

document.getElementById("paid").innerText=paid;

}


/* SEARCH */

function searchData(){

let value=
document.getElementById("search")
.value.toLowerCase();


let result=data.filter(p=>

p.name.toLowerCase().includes(value)
||
p.mobile.includes(value)

);


displayData(result);

}


/* RECEIPT */

function printReceipt(index){

let p=data[index];


let receipt=`

<!DOCTYPE html>

<html>

<head>

<title>वर्गणी Receipt</title>

<style>

body{
font-family:Arial;
padding:25px;
text-align:center;
}

.receipt{
border:2px solid #ff6600;
padding:25px;
max-width:400px;
margin:auto;
border-radius:15px;
}

h1{
color:#e65100;
}

hr{
margin:15px 0;
}

.info{
text-align:left;
line-height:2;
}

</style>

</head>

<body>

<div class="receipt">

<h1>🕉 श्री छत्रपती गणेश मित्र मंडळ 🕉️</h1>

<h3>घोडसगाव</h3>

<hr>

<h2>वर्गणी पावती</h2>

<div class="info">

<b>नाव:</b> ${p.name}<br>

<b>मोबाईल:</b> ${p.mobile}<br>

<b>रक्कम:</b> ₹${p.amount}<br>

<b>तारीख:</b> ${p.date}<br>

<b>Status:</b> ${p.status}

</div>

<hr>

<p>🙏 गणपती बाप्पा मोरया 🙏</p>

</div>

<script>

window.onload=function(){

window.print();

}

<\/script>

</body>

</html>

`;


let win=window.open("","_blank");

win.document.write(receipt);

win.document.close();

}


/* CSV DOWNLOAD */

function downloadCSV(){

if(data.length===0){

alert("Download करण्यासाठी Data उपलब्ध नाही.");

return;

}


let csv="क्र.,नाव,मोबाईल नंबर,रक्कम,तारीख,Status\n";


data.forEach((p,i)=>{

csv+=
`${i+1},"${p.name}","${p.mobile}",${p.amount},"${p.date}","${p.status}"\n`;

});


let blob=new Blob(
[csv],
{type:"text/csv;charset=utf-8;"}
);


let url=URL.createObjectURL(blob);


let a=document.createElement("a");

a.href=url;

a.download="Jay_chhatrpati_Mandal_Vargani.csv";

a.click();


URL.revokeObjectURL(url);

}


/* START */

displayData();

</script>

</body>

</html>
